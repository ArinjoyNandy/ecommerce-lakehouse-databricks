bundle:
  name: ecommerce-lakehouse-databricks

include:
  - config/*.json

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ebf60804-0cd6.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev
    variables:
      env: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-ebf60804-0cd6.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod
    variables:
      env: prod

resources:
  jobs:
    ecommerce_medallion_pipeline:
      name: "[${bundle.target}] E-Commerce Medallion Pipeline"
      
      # Daily schedule at 06:00 UTC
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - arinjoynandy2016@gmail.com
        no_alert_for_skipped_runs: false

      max_concurrent_runs: 1
      timeout_seconds: 7200

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest_runner.py
            base_parameters:
              env: ${bundle.target}
          job_cluster_key: pipeline_cluster

        - task_key: silver_cdc_merge
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/02_silver_cdc_runner.py
            base_parameters:
              env: ${bundle.target}
          job_cluster_key: pipeline_cluster

        - task_key: gold_maintenance_optimize
          depends_on:
            - task_key: silver_cdc_merge
          notebook_task:
            notebook_path: ./notebooks/03_gold_maintenance_runner.py
            base_parameters:
              env: ${bundle.target}
          job_cluster_key: pipeline_cluster

      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            autoscale:
              min_workers: 1
              max_workers: 3
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"