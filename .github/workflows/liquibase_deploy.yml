name: Liquibase Databricks CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/datablocks/**'
      - 'src/datamarts/**'
      - 'src/maintenance/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy-gold-layer:
    name: Deploy Gold DDL to Databricks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Liquibase (Direct Binary)
        run: |
          # 1. Download official Liquibase tarball
          curl -fsSL https://github.com/liquibase/liquibase/releases/download/v4.29.2/liquibase-4.29.2.tar.gz -o /tmp/liquibase.tar.gz
          
          # 2. Extract into /opt/liquibase and link executable
          sudo mkdir -p /opt/liquibase
          sudo tar -xzf /tmp/liquibase.tar.gz -C /opt/liquibase
          sudo ln -sf /opt/liquibase/liquibase /usr/local/bin/liquibase
          
          # 3. Verify CLI version
          liquibase --version

      - name: Download Databricks JDBC Driver & Liquibase Extension
        run: |
          sudo mkdir -p /opt/liquibase/lib

          # 1. Download official Databricks Simba JDBC Driver ZIP
          DRIVER_URL="https://databricks-bi-artifacts.s3.us-east-2.amazonaws.com/simbaspark-drivers/jdbc/2.6.36/DatabricksJDBC42-2.6.36.1062.zip"
          curl -fSL "$DRIVER_URL" -o /tmp/driver.zip
          unzip -q /tmp/driver.zip -d /tmp/driver_extracted
          sudo find /tmp/driver_extracted -name "*DatabricksJDBC*.jar" -exec cp {} /opt/liquibase/lib/DatabricksJDBC42.jar \;

          # 2. Download official Liquibase Databricks Extension (Resolves DATETIME -> TIMESTAMP dialect)
          EXTENSION_VERSION=$(curl -fsSL https://repo1.maven.org/maven2/org/liquibase/ext/liquibase-databricks/maven-metadata.xml | sed -n 's/.*<release>\(.*\)<\/release>.*/\1/p')
          if [ -z "$EXTENSION_VERSION" ]; then
            EXTENSION_VERSION="1.4.1"
          fi
          echo "Installing Liquibase Databricks extension version: $EXTENSION_VERSION"
          sudo curl -fSL "https://repo1.maven.org/maven2/org/liquibase/ext/liquibase-databricks/${EXTENSION_VERSION}/liquibase-databricks-${EXTENSION_VERSION}.jar" \
            -o /opt/liquibase/lib/liquibase-databricks.jar

          # 3. Verify both JARs are present
          ls -lh /opt/liquibase/lib/

      - name: Execute Liquibase Migrations
        env:
          DATABRICKS_JDBC_URL: ${{ secrets.DATABRICKS_JDBC_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          liquibase \
            --classpath="/opt/liquibase/lib/DatabricksJDBC42.jar:/opt/liquibase/lib/liquibase-databricks.jar" \
            --url="${DATABRICKS_JDBC_URL}" \
            --username="token" \
            --password="${DATABRICKS_TOKEN}" \
            --driver="com.databricks.client.jdbc.Driver" \
            --changelog-file="src/datablocks/schema_changes/datablock.changelog.yml" \
            update
