name: Liquibase Databricks CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/datablocks/**'
      - 'src/datamarts/**'
      - 'src/maintenance/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy-gold-layer:
    name: Deploy Gold DDL to Databricks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Liquibase (Direct Binary)
        run: |
          # 1. Download official Liquibase archive
          curl -fsSL https://github.com/liquibase/liquibase/releases/download/v4.29.2/liquibase-4.29.2.tar.gz -o /tmp/liquibase.tar.gz
          
          # 2. Extract into /opt/liquibase and create global symlink
          sudo mkdir -p /opt/liquibase
          sudo tar -xzf /tmp/liquibase.tar.gz -C /opt/liquibase
          sudo ln -sf /opt/liquibase/liquibase /usr/local/bin/liquibase
          
          # 3. Verify installation
          liquibase --version

      - name: Download Databricks JDBC Driver
        run: |
          sudo curl -L -o /opt/liquibase/lib/DatabricksJDBC42.jar \
            https://databricks-bi-artifacts.s3.us-east-2.amazonaws.com/simbaspark-drivers/jdbc/2.6.36/DatabricksJDBC42.jar

      - name: Execute Liquibase Migrations
        env:
          DATABRICKS_JDBC_URL: ${{ secrets.DATABRICKS_JDBC_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          liquibase \
            --classpath="/opt/liquibase/lib/DatabricksJDBC42.jar" \
            --url="${DATABRICKS_JDBC_URL}" \
            --username="token" \
            --password="${DATABRICKS_TOKEN}" \
            --driver="com.databricks.client.jdbc.Driver" \
            --changelog-file="src/datablocks/schema_changes/datablock.changelog.yml" \
            update
