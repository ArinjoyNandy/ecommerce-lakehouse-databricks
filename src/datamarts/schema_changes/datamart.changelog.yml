# Liquibase Changelog — DataMarts (Gold Reporting Views)
# Source: Curated DataBlocks (mv_datablock_customer_360, mv_datablock_sales_order_lineage)

databaseChangeLog:

  # ── 101 · Daily Executive Sales Mart ───────────────────────────
  - changeSet:
      id: 101-create-v-mart-daily-executive-sales
      author: ecommerce-lakehouse
      runOnChange: true
      comment: Aggregate daily sales KPIs from order lineage
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            catalogName: ecommerce_dev
            schemaName: gold
            tableName: datablock_sales_order_lineage
      changes:
        - sqlFile:
            path: ../v_mart_daily_executive_sales.sql
            relativeToChangelogFile: true
            splitStatements: false

